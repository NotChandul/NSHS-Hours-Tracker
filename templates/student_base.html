<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NSHS Service Hours{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <!--
    Student top bar: brand on the left, nav links on the right.
    The public-topbar CSS already allows flex-wrap on mobile so the nav
    drops to a second line on very narrow screens rather than overflowing.
  -->
  <div class="student-topbar">
    <div class="student-brand">
      <span class="sidebar-logo-icon" style="width:28px;height:28px;font-size:.8rem;">&Sigma;</span>
      NSHS Service Hours
    </div>
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <a href="{{ url_for('announcements') }}" class="btn-app-link" style="font-size:.85rem;">Announcements</a>
      <a href="{{ url_for('logout') }}" class="btn-app-outline" style="font-size:.8rem;padding:.4rem .85rem;">Sign Out</a>
    </div>
  </div>

  <main class="student-main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert-app alert-app-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
