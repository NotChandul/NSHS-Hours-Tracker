<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NSHS Service Hours{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-tabs">
        <a href="{{ url_for('login') }}" class="auth-tab {{ 'active' if request.endpoint == 'login' else '' }}">Log In</a>
        <a href="{{ url_for('register') }}" class="auth-tab {{ 'active' if request.endpoint == 'register' else '' }}">Student Register</a>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert-app alert-app-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block auth_content %}{% endblock %}
    </div>
  </div>

  <script>
    function togglePassword(fieldId, iconEl) {
      const field = document.getElementById(fieldId);
      if (field.type === 'password') {
        field.type = 'text';
        iconEl.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        field.type = 'password';
        iconEl.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }
  </script>
</body>
</html>
